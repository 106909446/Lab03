<!DOCTYPE html>

<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
    <meta name = "description" content = "CWA Help Desk Appointment Form">
    <meta name = "keywords" content = "Form, Appointment, Swinburne University of Technology">
    <meta name = "author" content = "Swinburne University of Technology">

    <title>CWA Help Desk Appointment</title>
</head>

<body>

    <img src = "Images/logo.png" alt = "Swinburne University of Technology Logo" width = "10%" height = "10%"><a href = "https://www.swin.edu.au"></a>

    <h1>CWA Help Desk Appointment</h1>

    <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
    <p>Check Blackboard for when CWA tutors will be there.</p>

    <form action="http://mercury.swin.edu.au/it000000/formtest.php" method="post">

        <fieldset>

            <legend>Student Details</legend>
            <p><label for = "StuID">Student ID:</label>
            <input type = "text" id = "StuID" name = "StuID" required="required" pattern = "\d{7,10}" size = "10"></p>
            
            <p>
                <label for = "givenname">Given Name:</label>
                <input type = "text" id = "givenname" name = "givenname" required="required"
                pattern = "[A-Za-z]{1,15}" size = "10">

                <label for = "familyname">Family Name:</label>
                <input type = "text" id = "familyname" name = "familyname" required="required"
                pattern = "[A-Za-z]{1,15}" size = "10">
            </p>
            
           

        </fieldset>


        <fieldset>

            <legend>Your unit</legend>
            <p>
                
                <input type = "radio" id = "COS10011" name = "unit" value = "COS10011" required="required">
                <label for = "COS10011">COS10011</label>

                <input type = "radio" id = "COS60004" name = "unit" value = "COS60004">
                <label for = "COS60004">COS60004</label>

                <input type = "radio" id = "COS60007" name = "unit" value = "COS60007">
                <label for = "COS60007">COS60007</label>


            </p>

            <p>

                <label for = "tutor"> Your Tutor</label>
                <select name = "tutor" id = "tutor" required="required">
                    <option value = "">Please Select</option>
                    <option value = "mrtrung">Mr Trung</option>
                    <option value = "mrdoan">Mr Doan</option>
                    <option value = "mrwilson">Mr Wilson</option>
                </select>

            </p>


        </fieldset>



        <fieldset>

            <legend>Issue</legend>

            <p>

                <label for = "html">HTML</label>
                <input type = "checkbox" id = "html" name = "issue[]" value = "HTML" checked="checked">

                <label for = "css">CSS</label>
                <input type = "checkbox" id = "css" name = "issue[]" value = "CSS">

                <label for = "javascript">JavaScript</label>
                <input type = "checkbox" id = "javascript" name = "issue[]" value = "JavaScript">

                <label for = "php">PHP</label>
                <input type = "checkbox" id = "php" name = "issue[]" value = "PHP">

                <label for = "mysql">MySQL</label>
                <input type = "checkbox" id = "mysql" name = "issue[]" value = "MySQL">

            </p>

            <p>

                <label for = "issuedescription">Description of Issue</label>
                <br>
                <textarea id = "issuedescription" name = "issuedescription" 
                rows = "4" cols = "40" 
                placeholder = "Write description of your problem here..."></textarea>

            </p>


        </fieldset>


        <fieldset>

            <legend>Preferred Date / Time</legend>

            <p>
                <label for = "date">Date</label>
                <input type = "text" id = "date" name = "date" placeholder = "dd/mm/yyyy" 
                required="required" size = "10" pattern = "\d{2}/\d{2}/\d{4}">

                <br>

                <label for = "time">Time</label>
                <input type = "text" id = "time" name = "time" placeholder = "00:00"
                required="required" size = "10" pattern = "\d{2}:\d{2}">

                <!-- <label for = "date">Date</label>
                <input type = "date" id = "date" name = "date" placeholder = "dd/mm/yyyy"
                required="required" size = "10">

                <br>

                <label for = "time">Time</label>
                <input type = "time" id = "time" name = "time" placeholder = "00:00"
                required="required" size = "10"> -->


            </p>

        </fieldset>

        <p>

            <input type = "submit" value = "Book">
            <input type = "reset" value = "Reset form">
            
        </p>


    </form>

</body>

</html>
